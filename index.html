<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotografía</title>
  <meta name="description" content="Portfolio de fotografía">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" id="brand"></a>
    <nav class="nav">
      <a href="#/" data-nav="home">Galerías</a>
      <a href="#contacto" data-nav="contact">Contacto</a>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Visor de fotos">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Cerrar">&times;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Anterior">&#8249;</button>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Siguiente">&#8250;</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
